    calc(100% - 10px) 50%;
  background-repeat: no-repeat;
  background-size: 4px 4px;
  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;script&gt;
(() =&gt; {

  add(&#x27;home&#x27;,&#x27;人生总控&#x27;,[&#x27;values&#x27;,&#x27;domains&#x27;,&#x27;evidence&#x27;,&#x27;engine&#x27;,&#x27;knowledge&#x27;,&#x27;action&#x27;],[],&#x27;协调时间、资金与承诺&#x27;);

  add(&#x27;domains&#x27;,&#x27;管理什么：9个领域&#x27;,[&#x27;D01&#x27;,&#x27;D02&#x27;,&#x27;D03&#x27;,&#x27;D04&#x27;,&#x27;D05&#x27;,&#x27;D06&#x27;,&#x27;D07&#x27;,&#x27;D08&#x27;,&#x27;D09&#x27;],[&#x27;健康 · 心理 · 关系&#x27;,&#x27;职业 · 学习 · 财务&#x27;,&#x27;日常 · 社群 · 体验&#x27;],&#x27;按生活结果划分&#x27;);
  const domains = [
    [&#x27;D01&#x27;,&#x27;身体健康与恢复&#x27;,[&#x27;身体功能&#x27;,&#x27;作息与恢复&#x27;,&#x27;照护安排&#x27;],[&#x27;M21&#x27;,&#x27;M03&#x27;]],
    [&#x27;D02&#x27;,&#x27;心理状态与自我调节&#x27;,[&#x27;情绪体验&#x27;,&#x27;压力与应对&#x27;,&#x27;环境支持&#x27;],[&#x27;M10&#x27;,&#x27;M21&#x27;,&#x27;M23&#x27;]],
    [&#x27;D03&#x27;,&#x27;关系、家庭与照护&#x27;,[&#x27;亲密关系与友谊&#x27;,&#x27;家庭承诺&#x27;,&#x27;照护与协商&#x27;],[&#x27;M17&#x27;,&#x27;M10&#x27;,&#x27;M20&#x27;]],
    [&#x27;D04&#x27;,&#x27;职业、劳动与价值创造&#x27;,[&#x27;工作与创业&#x27;,&#x27;产品与实际交付&#x27;,&#x27;合作及职业路径&#x27;],[&#x27;M08&#x27;,&#x27;M11&#x27;,&#x27;M18&#x27;,&#x27;M17&#x27;]],
    [&#x27;D05&#x27;,&#x27;学习、能力与探索&#x27;,[&#x27;理解与技能&#x27;,&#x27;练习和真实作品&#x27;,&#x27;独立解决问题&#x27;],[&#x27;M01&#x27;,&#x27;M02&#x27;,&#x27;M15&#x27;,&#x27;M16&#x27;,&#x27;M22&#x27;]],
    [&#x27;D06&#x27;,&#x27;财务、资产与保障&#x27;,[&#x27;收支与现金流&#x27;,&#x27;支付能力&#x27;,&#x27;风险承受范围&#x27;],[&#x27;M19&#x27;,&#x27;M03&#x27;,&#x27;M20&#x27;]],
    [&#x27;D07&#x27;,&#x27;居住、日常与基础设施&#x27;,[&#x27;居住与交通&#x27;,&#x27;家务与证照&#x27;,&#x27;数字工具&#x27;],[&#x27;M06&#x27;,&#x27;M15&#x27;,&#x27;M16&#x27;,&#x27;M18&#x27;]],
    [&#x27;D08&#x27;,&#x27;社群、公共参与与生态责任&#x27;,[&#x27;公共参与&#x27;,&#x27;共同责任&#x27;,&#x27;社会及生态影响&#x27;],[&#x27;M11&#x27;,&#x27;M12&#x27;,&#x27;M23&#x27;]],
    [&#x27;D09&#x27;,&#x27;休闲、审美与生命体验&#x27;,[&#x27;玩乐与自由时间&#x27;,&#x27;艺术与审美&#x27;,&#x27;体验本身的价值&#x27;],[&#x27;M23&#x27;,&#x27;M10&#x27;]]

  domains.forEach(([id,label,items,mods]) =&gt; {

  add(&#x27;evidence&#x27;,&#x27;依据什么：数据与证据&#x27;,[&#x27;sources&#x27;,&#x27;quality&#x27;,&#x27;state&#x27;,&#x27;ask&#x27;],[&#x27;已授权来源 + 用户补充&#x27;,&#x27;事实、假设、未知分开&#x27;],&#x27;先看清现状，再提出建议&#x27;);

  add(&#x27;engine&#x27;,&#x27;怎样决策：8个阶段&#x27;,[&#x27;S1&#x27;,&#x27;S2&#x27;,&#x27;S3&#x27;,&#x27;S4&#x27;,&#x27;S5&#x27;,&#x27;S6&#x27;,&#x27;S7&#x27;,&#x27;S8&#x27;],[&#x27;定义 → 事实 → 方案 → 比较&#x27;,&#x27;复核 → 取舍 → 执行 → 更新&#x27;],&#x27;阶段有顺序，也允许回退&#x27;);
  const stages = [
    [&#x27;S1&#x27;,&#x27;定义问题&#x27;,[&#x27;目标、期限、资源&#x27;,&#x27;不能突破的边界&#x27;],[&#x27;M01&#x27;,&#x27;M05&#x27;,&#x27;M10&#x27;,&#x27;M14&#x27;,&#x27;M23&#x27;]],
    [&#x27;S2&#x27;,&#x27;建立事实&#x27;,[&#x27;核实来源与实际情况&#x27;,&#x27;分清事实、假设与未知&#x27;],[&#x27;M01&#x27;,&#x27;M03&#x27;,&#x27;M12&#x27;,&#x27;M13&#x27;,&#x27;M15&#x27;,&#x27;M22&#x27;]],
    [&#x27;S3&#x27;,&#x27;生成方案&#x27;,[&#x27;行动、维持现状、暂缓&#x27;,&#x27;小规模试行与分阶段方案&#x27;],[&#x27;M05&#x27;,&#x27;M07&#x27;,&#x27;M08&#x27;,&#x27;M09&#x27;,&#x27;M11&#x27;,&#x27;M14&#x27;]],
    [&#x27;S4&#x27;,&#x27;约束与比较&#x27;,[&#x27;先查整个组合能否可行&#x27;,&#x27;再比成本、风险与取舍&#x27;],[&#x27;M02&#x27;,&#x27;M03&#x27;,&#x27;M05&#x27;,&#x27;M06&#x27;,&#x27;M07&#x27;,&#x27;M19&#x27;,&#x27;M20&#x27;,&#x27;M21&#x27;]],
    [&#x27;S5&#x27;,&#x27;反驳与复核&#x27;,[&#x27;找反例、复算关键数字&#x27;,&#x27;证据不足则返回补证&#x27;],[&#x27;M01&#x27;,&#x27;M03&#x27;,&#x27;M04&#x27;,&#x27;M10&#x27;,&#x27;M14&#x27;]],
    [&#x27;S6&#x27;,&#x27;建议与取舍&#x27;,[&#x27;说明建议成立的条件&#x27;,&#x27;记录用户的真实选择&#x27;],[&#x27;M05&#x27;,&#x27;M10&#x27;,&#x27;M17&#x27;,&#x27;M23&#x27;]],
    [&#x27;S7&#x27;,&#x27;授权执行&#x27;,[&#x27;安排任务、资源与期限&#x27;,&#x27;明确验收和停止条件&#x27;],[&#x27;M06&#x27;,&#x27;M11&#x27;,&#x27;M15&#x27;,&#x27;M16&#x27;,&#x27;M17&#x27;,&#x27;M18&#x27;]],
    [&#x27;S8&#x27;,&#x27;反馈更新&#x27;,[&#x27;对照预期与实际结果&#x27;,&#x27;回到最早受影响阶段&#x27;],[&#x27;M03&#x27;,&#x27;M04&#x27;,&#x27;M13&#x27;,&#x27;M14&#x27;,&#x27;M15&#x27;,&#x27;M18&#x27;]]
